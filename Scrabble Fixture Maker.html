<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Scrabble Fixture Maker</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600..800&family=DM+Mono:wght@400;500&family=Instrument+Sans:wght@400..600&display=swap">
<style>
/* Layout: a setup rail on the left, board-by-board fixtures on the right. Rounds are stacked bands; each board is a row of Scrabble tiles joined by "v". */
:root {
  --bg: #ecefeb;
  --surface: #f7f9f6;
  --ink: #17231e;
  --muted: #566860;
  --line: #d2d9d3;
  --line-strong: #a9b6ad;
  --tile: #ecdaae;
  --tile-edge: #c4ab70;
  --tile-ink: #2a2112;
  --accent: #1d65a0;
  --accent-edge: #134670;
  --accent-ink: #ffffff;
  --hot: #bf3b2b;
  --dw: #e58ca1;
  --display: "Bricolage Grotesque", "Arial Narrow", Arial, sans-serif;
  --body: "Instrument Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono: "DM Mono", ui-monospace, "SF Mono", Menlo, monospace;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1613;
    --surface: #17211c;
    --ink: #e7eee9;
    --muted: #97a79e;
    --line: #2a3832;
    --line-strong: #4a5d54;
    --tile: #dcc995;
    --tile-edge: #a38f58;
    --tile-ink: #231b0b;
    --accent: #6cb2ea;
    --accent-edge: #3d7fb3;
    --accent-ink: #0a1a27;
    --hot: #f07a68;
    --dw: #c96f86;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1613;
  --surface: #17211c;
  --ink: #e7eee9;
  --muted: #97a79e;
  --line: #2a3832;
  --line-strong: #4a5d54;
  --tile: #dcc995;
  --tile-edge: #a38f58;
  --tile-ink: #231b0b;
  --accent: #6cb2ea;
  --accent-edge: #3d7fb3;
  --accent-ink: #0a1a27;
  --hot: #f07a68;
  --dw: #c96f86;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font: 400 1rem/1.5 var(--body);
  padding-inline: 1rem;
  padding-block: 1.5rem 3rem;
}
.wrap { max-width: 76rem; margin-inline: auto; display: flex; flex-direction: column; gap: 1.5rem; }
h1, h2, h3, p { margin: 0; }
button, input, textarea { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- header ---------- */
.top { display: flex; flex-direction: column; gap: 0.6rem; }
.eyebrow { font: 500 0.75rem/1 var(--mono); letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }
.word { display: flex; flex-wrap: wrap; gap: 0.3rem; font-size: 1rem; }
.word .tile { --s: clamp(2rem, 9vw, 2.9rem); cursor: default; font-size: clamp(1.2rem, 5.4vw, 1.75rem); }
.pts { position: absolute; right: 0.22rem; bottom: 0.12rem; font: 500 0.55rem/1 var(--mono); }
.lede { max-width: 42rem; color: var(--muted); }

/* ---------- tiles ---------- */
.tile {
  --s: 2.75rem;
  width: var(--s); height: var(--s);
  display: grid; place-items: center; position: relative; padding: 0;
  font: 800 1.35rem/1 var(--display);
  color: var(--tile-ink);
  background: var(--tile);
  border: 0; border-radius: 4px;
  box-shadow: 0 1px 0 var(--tile-edge), 0 2px 0 var(--tile-edge), 0 4px 5px rgba(0,0,0,0.2), inset 0 1px 0 rgba(255,255,255,0.45);
  user-select: none;
}
button.tile { cursor: pointer; transition: transform 0.12s ease, background-color 0.12s ease; }
@media (hover: hover) { button.tile:hover { transform: translateY(-2px); } }
.tile.on {
  background: var(--accent); color: var(--accent-ink);
  box-shadow: 0 1px 0 var(--accent-edge), 0 2px 0 var(--accent-edge), 0 4px 5px rgba(0,0,0,0.25), inset 0 1px 0 rgba(255,255,255,0.25);
}
.tile.ph { background: transparent; box-shadow: none; border: 1.5px dashed var(--line-strong); color: var(--muted); font-weight: 600; }
.tile.full { cursor: not-allowed; opacity: 0.55; }
.rank {
  position: absolute; top: -0.45rem; right: -0.45rem; min-width: 1.15rem; height: 1.15rem; padding-inline: 0.2rem;
  display: grid; place-items: center; border-radius: 999px;
  background: var(--ink); color: var(--bg); font: 500 0.68rem/1 var(--mono); font-style: normal;
}
.slot { display: flex; flex-direction: column; align-items: center; gap: 0.35rem; min-width: 0; }
.cap { font-size: 0.72rem; line-height: 1.15; color: var(--muted); text-align: center; max-width: 5.5rem; overflow-wrap: anywhere; min-height: 0.85rem; }

/* ---------- layout ---------- */
.shell { display: grid; gap: 1.5rem; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 62rem) { .shell { grid-template-columns: 21rem minmax(0, 1fr); } }

.setup {
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px;
  padding: 1.25rem; display: flex; flex-direction: column; gap: 1.25rem; min-width: 0;
}
@media (min-width: 62rem) {
  .setup { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 1rem); max-height: calc(100vh - 2rem); overflow-y: auto; }
}
.setup h2, .out-h { font: 700 1.05rem/1.2 var(--display); letter-spacing: -0.01em; }

.field { display: flex; flex-direction: column; gap: 0.4rem; }
.field > label, .legend { font: 500 0.78rem/1.2 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.step { display: flex; align-items: stretch; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; background: var(--bg); }
.step button {
  width: 2.9rem; border: 0; background: transparent; cursor: pointer; font: 600 1.35rem/1 var(--display); color: var(--ink);
}
.step button:hover { background: var(--line); }
.step input {
  flex: 1; min-width: 0; text-align: center; border: 0; border-inline: 1px solid var(--line);
  background: transparent; font: 500 1.5rem/1 var(--mono); padding-block: 0.6rem; -moz-appearance: textfield; appearance: textfield;
}
.step input::-webkit-outer-spin-button, .step input::-webkit-inner-spin-button { -webkit-appearance: none; margin: 0; }
.hint { font-size: 0.82rem; color: var(--muted); min-height: 1.2rem; }
.err { font-size: 0.82rem; color: var(--hot); min-height: 0; }
.err:empty { display: none; }

.seg { display: flex; border: 1px solid var(--line-strong); border-radius: 6px; overflow: hidden; }
.seg label { flex: 1; text-align: center; padding: 0.55rem 0.5rem; cursor: pointer; font-size: 0.9rem; border-inline-end: 1px solid var(--line); }
.seg label:last-child { border-inline-end: 0; }
.seg input { position: absolute; opacity: 0; pointer-events: none; }
.seg input:checked + span { font-weight: 600; }
.seg label:has(input:checked) { background: var(--ink); color: var(--bg); }
.seg label:has(input:focus-visible) { outline: 2px solid var(--accent); outline-offset: -2px; }

.btn {
  border: 1px solid var(--line-strong); background: transparent; border-radius: 6px; padding: 0.5rem 0.85rem; cursor: pointer; font-size: 0.9rem;
}
.btn:hover { background: var(--line); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); font-weight: 600; }
.btn.primary:hover { opacity: 0.9; background: var(--ink); }
.row { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; }

details summary { cursor: pointer; font-size: 0.9rem; }
textarea {
  width: 100%; min-height: 7rem; margin-top: 0.6rem; resize: vertical; border: 1px solid var(--line-strong); border-radius: 6px;
  background: var(--bg); padding: 0.6rem; font: 0.88rem/1.45 var(--mono);
}
.roster { display: flex; flex-wrap: wrap; gap: 0.7rem 0.45rem; }
.roster .tile { --s: 2.1rem; font-size: 1.05rem; cursor: default; }
.roster .slot { width: 3.4rem; }

/* ---------- output ---------- */
.out { display: flex; flex-direction: column; gap: 1.75rem; min-width: 0; }
.path { display: flex; flex-direction: column; gap: 0.75rem; }
.path .sum { color: var(--muted); }
.path ol { list-style: none; margin: 0; padding: 0; display: flex; flex-wrap: wrap; gap: 0.5rem; }
.path li {
  display: flex; flex-direction: column; gap: 0.15rem; padding: 0.55rem 0.8rem; min-width: 6.5rem;
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px;
}
.path li.final { border-color: var(--hot); }
.path .r { font: 700 0.95rem/1.2 var(--display); }
.path li.final .r { color: var(--hot); }
.path .n { font: 500 0.78rem/1.3 var(--mono); color: var(--muted); }

.round { display: flex; flex-direction: column; gap: 0.9rem; }
.round > header { display: flex; flex-wrap: wrap; align-items: baseline; justify-content: space-between; gap: 0.25rem 1rem; padding-bottom: 0.55rem; border-bottom: 2px solid var(--ink); }
.round h2 { font: 800 1.7rem/1.1 var(--display); letter-spacing: -0.02em; }
.round.final > header { border-color: var(--hot); }
.round.final h2 { color: var(--hot); }
.round .rm { font: 500 0.8rem/1.3 var(--mono); color: var(--muted); }
.boards { display: grid; gap: 0.9rem; grid-template-columns: repeat(auto-fill, minmax(min(100%, 17.5rem), 1fr)); }
.board {
  background: var(--surface); border: 1px solid var(--line); border-radius: 6px; padding: 0.9rem 1rem 0.8rem;
  display: flex; flex-direction: column; gap: 0.9rem; min-width: 0;
}
.board > header { display: flex; align-items: baseline; justify-content: space-between; gap: 0.5rem; flex-wrap: wrap; }
.board h3 { font: 700 1.05rem/1.2 var(--display); }
.board .meta { font: 500 0.78rem/1.2 var(--mono); color: var(--muted); }
.match { display: flex; flex-wrap: wrap; align-items: flex-start; gap: 0.6rem 0.35rem; padding-top: 0.3rem; }
.match .v { align-self: flex-start; height: 2.75rem; display: grid; place-items: center; padding-inline: 0.1rem; font: 500 0.85rem/1 var(--mono); color: var(--muted); }
.status { font-size: 0.85rem; color: var(--muted); min-height: 1.3rem; }
.status.done { color: var(--accent); font-weight: 600; }
.status.champ { color: var(--hot); font-weight: 700; }
.board.final-board { max-width: 34rem; border-color: var(--hot); }
.board.final-board .match .v { color: var(--dw); }
.fallback { width: 100%; min-height: 10rem; margin-top: 0; }
.toast { font-size: 0.85rem; color: var(--accent); min-height: 1.25rem; }
.help { font-size: 0.88rem; color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }
@media (prefers-reduced-motion: reduce) { button.tile { transition: none; } button.tile:hover { transform: none; } }
</style>

<div class="wrap">
  <header class="top">
    <p class="eyebrow">Scrabble tournament</p>
    <h1 class="word" aria-label="Fixtures">
      <span class="tile" aria-hidden="true">F<sub class="pts">4</sub></span><span class="tile" aria-hidden="true">I<sub class="pts">1</sub></span><span class="tile" aria-hidden="true">X<sub class="pts">8</sub></span><span class="tile" aria-hidden="true">T<sub class="pts">1</sub></span><span class="tile" aria-hidden="true">U<sub class="pts">1</sub></span><span class="tile" aria-hidden="true">R<sub class="pts">1</sub></span><span class="tile" aria-hidden="true">E<sub class="pts">1</sub></span><span class="tile" aria-hidden="true">S<sub class="pts">1</sub></span>
    </h1>
    <p class="lede">Enter the number of players, how many sit at each board and how many go through. Every player gets a letter, and the rounds are drawn all the way to the final.</p>
  </header>

  <div class="shell">
    <aside class="setup" aria-label="Tournament setup">
      <h2>Setup</h2>

      <div class="field">
        <label for="n">Participants</label>
        <div class="step">
          <button type="button" data-step="n" data-dir="-1" aria-label="One fewer participant">&minus;</button>
          <input id="n" type="number" inputmode="numeric" min="2" max="200" value="13">
          <button type="button" data-step="n" data-dir="1" aria-label="One more participant">+</button>
        </div>
        <p class="hint" id="hint-n"></p>
        <p class="err" id="err-n" role="alert"></p>
      </div>

      <div class="field">
        <label for="g">Players per board</label>
        <div class="step">
          <button type="button" data-step="g" data-dir="-1" aria-label="One fewer player per board">&minus;</button>
          <input id="g" type="number" inputmode="numeric" min="2" max="50" value="3">
          <button type="button" data-step="g" data-dir="1" aria-label="One more player per board">+</button>
        </div>
        <p class="hint" id="hint-g"></p>
        <p class="err" id="err-g" role="alert"></p>
      </div>

      <div class="field">
        <label for="k">Move on from each board</label>
        <div class="step">
          <button type="button" data-step="k" data-dir="-1" aria-label="One fewer advancing player">&minus;</button>
          <input id="k" type="number" inputmode="numeric" min="1" max="49" value="2">
          <button type="button" data-step="k" data-dir="1" aria-label="One more advancing player">+</button>
        </div>
        <p class="hint" id="hint-k"></p>
        <p class="err" id="err-k" role="alert"></p>
      </div>

      <div class="field">
        <span class="legend" id="draw-l">Round 1 draw</span>
        <div class="seg" role="radiogroup" aria-labelledby="draw-l">
          <label><input type="radio" name="draw" value="order" id="draw-order"><span>A, B, C&hellip;</span></label>
          <label><input type="radio" name="draw" value="random" id="draw-random"><span>Random</span></label>
        </div>
        <div class="row"><button type="button" class="btn" id="reshuffle" hidden>Reshuffle draw</button></div>
      </div>

      <details>
        <summary>Add player names (optional)</summary>
        <textarea id="names" placeholder="One name per line.&#10;The first line is player A, the second is B, and so on." aria-label="Player names, one per line"></textarea>
      </details>

      <div class="field">
        <span class="legend">Letters</span>
        <div class="roster" id="players"></div>
      </div>

      <div class="field">
        <div class="row">
          <button type="button" class="btn primary" id="copy">Copy fixtures</button>
          <button type="button" class="btn" id="clear">Clear results</button>
        </div>
        <p class="toast" id="toast" role="status"></p>
        <textarea id="fallback" class="fallback" readonly hidden aria-label="Fixtures as text"></textarea>
      </div>
    </aside>

    <main class="out" id="out" aria-live="polite"></main>
  </div>
</div>

<script>
(function () {
  'use strict';
  var LS = 'scrabble-fixture-maker-v1';
  var $ = function (s) { return document.querySelector(s); };
  var S = { n: 13, g: 3, k: 2, draw: 'order', perm: [], names: '', results: {} };
  try {
    var raw = localStorage.getItem(LS);
    if (raw) { var o = JSON.parse(raw); if (o && typeof o === 'object') S = Object.assign(S, o); }
  } catch (e) {}

  function clamp(v, a, b) { return Math.min(b, Math.max(a, v)); }
  S.n = clamp(parseInt(S.n, 10) || 13, 2, 200);
  S.g = clamp(parseInt(S.g, 10) || 3, 2, 50);
  S.k = clamp(parseInt(S.k, 10) || 1, 1, S.g - 1);
  if (S.draw !== 'random') S.draw = 'order';
  if (typeof S.names !== 'string') S.names = '';
  if (!S.results || typeof S.results !== 'object' || Array.isArray(S.results)) S.results = {};

  function save() { try { localStorage.setItem(LS, JSON.stringify(S)); } catch (e) {} }
  function esc(s) { return String(s).replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }

  function label(i) {
    var s = '';
    do { s = String.fromCharCode(65 + (i % 26)) + s; i = Math.floor(i / 26) - 1; } while (i >= 0);
    return s;
  }
  function indexOfLabel(l) {
    var n = 0;
    for (var i = 0; i < l.length; i++) n = n * 26 + (l.charCodeAt(i) - 64);
    return n - 1;
  }
  function ord(n) {
    var m = n % 100;
    if (m >= 11 && m <= 13) return n + 'th';
    return n + (['th', 'st', 'nd', 'rd'][n % 10] || 'th');
  }
  function shuffled(n) {
    var a = [], i, j, t;
    for (i = 0; i < n; i++) a.push(i);
    for (i = n - 1; i > 0; i--) { j = Math.floor(Math.random() * (i + 1)); t = a[i]; a[i] = a[j]; a[j] = t; }
    return a;
  }
  function ensurePerm() {
    var ok = Array.isArray(S.perm) && S.perm.length === S.n;
    if (ok) {
      var seen = {};
      for (var i = 0; i < S.perm.length; i++) {
        var v = S.perm[i];
        if (!(v >= 0 && v < S.n) || seen[v]) { ok = false; break; }
        seen[v] = 1;
      }
    }
    if (!ok) S.perm = shuffled(S.n);
  }

  var NAMES = [];
  function parseNames() { NAMES = S.names.split(/\r?\n/).map(function (s) { return s.trim(); }); }
  function nameOf(l) { return NAMES[indexOfLabel(l)] || ''; }
  function plural(n, w) { return n + ' ' + w + (n === 1 ? '' : 's'); }
  function versus(size) { return Array(size + 1).join('1v').slice(0, -1); }

  /* Builds every round from the current setup and any results entered so far. */
  function build() {
    var order = S.draw === 'random' ? S.perm : S.perm.map(function (_, i) { return i; });
    var slots = order.map(function (i) { return { l: label(i) }; });
    var rounds = [];
    for (var r = 0; r < 60; r++) {
      var n = slots.length;
      var isFinal = n <= S.g;
      var gc = isFinal ? 1 : Math.ceil(n / S.g);
      var base = Math.floor(n / gc), extra = n % gc;
      var groups = [], i;
      for (i = 0; i < gc; i++) groups.push([]);
      if (r === 0) {
        var p = 0;
        for (i = 0; i < gc; i++) { var sz = base + (i < extra ? 1 : 0); groups[i] = slots.slice(p, p + sz); p += sz; }
      } else {
        slots.forEach(function (s, t) {
          var row = Math.floor(t / gc), c = t % gc;
          groups[row % 2 ? gc - 1 - c : c].push(s);
        });
      }
      var boards = groups.map(function (members, gi) {
        var size = members.length;
        var k = isFinal ? 1 : Math.min(size, Math.max(1, Math.min(S.k, size - 1)));
        var key = r + '-' + gi;
        var pending = members.some(function (m) { return m.ph; });
        var sel = (S.results[key] || []).filter(function (l) { return members.some(function (m) { return m.l === l; }); }).slice(0, k);
        var bye = size === 1 && !!members[0].l;
        if (bye) sel = [members[0].l];
        return { key: key, members: members, size: size, k: k, sel: sel, pending: pending, bye: bye };
      });
      var round = { idx: r, isFinal: isFinal, n: n, boards: boards, adv: 0 };
      rounds.push(round);
      if (isFinal) break;
      var maxK = 0;
      boards.forEach(function (b) { if (b.k > maxK) maxK = b.k; round.adv += b.k; });
      var next = [];
      for (var j = 0; j < maxK; j++) {
        boards.forEach(function (b, bi) {
          if (j < b.k) next.push(b.sel[j] ? { l: b.sel[j] } : { ph: ord(j + 1) + ' of Board ' + (bi + 1) });
        });
      }
      slots = next;
    }
    return rounds;
  }

  var CUR = [];

  function tileHTML(m, b) {
    if (m.ph) {
      return '<div class="slot"><span class="tile ph" aria-hidden="true">?</span><span class="cap">' + esc(m.ph) + '</span></div>';
    }
    var pos = b.sel.indexOf(m.l), on = pos > -1;
    var nm = nameOf(m.l);
    var cap = '<span class="cap">' + esc(nm) + '</span>';
    var rank = on ? '<i class="rank">' + (pos + 1) + '</i>' : '';
    if (b.pending) {
      return '<div class="slot"><span class="tile">' + m.l + '</span>' + cap + '</div>';
    }
    var full = !on && b.sel.length >= b.k;
    var al = m.l + (nm ? ', ' + nm : '') + (on ? ', advancing in place ' + (pos + 1) : '');
    return '<div class="slot"><button type="button" class="tile' + (on ? ' on' : '') + (full ? ' full' : '') + '" data-key="' + b.key +
      '" data-l="' + m.l + '" aria-pressed="' + on + '" aria-label="' + esc(al) + '">' + m.l + rank + '</button>' + cap + '</div>';
  }

  function boardHTML(round, b, bi) {
    var tiles = b.members.map(function (m) { return tileHTML(m, b); }).join('<span class="v" aria-hidden="true">v</span>');
    var meta = b.size === 1 ? 'Bye' : versus(b.size);
    var status;
    if (b.bye) status = '<p class="status done">Bye. Moves on automatically.</p>';
    else if (b.pending) status = '<p class="status">Waiting for Round ' + round.idx + ' results.</p>';
    else if (round.isFinal) {
      status = b.sel.length
        ? '<p class="status champ">Champion: ' + b.sel[0] + (nameOf(b.sel[0]) ? ', ' + esc(nameOf(b.sel[0])) : '') + '</p>'
        : '<p class="status">Tap the winner.</p>';
    } else if (b.sel.length >= b.k) {
      status = '<p class="status done">Moving on: ' + b.sel.join(', ') + '</p>';
    } else {
      var left = b.k - b.sel.length;
      status = '<p class="status">Tap ' + (b.k > 1 ? (left === b.k ? 'the top ' + b.k + ' in finishing order' : plural(left, 'more player')) : 'the winner') + '.</p>';
    }
    var adv = round.isFinal ? 'one winner' : (b.k === b.size ? 'all move on' : 'top ' + b.k + ' move on');
    return '<article class="board' + (round.isFinal ? ' final-board' : '') + '"><header><h3>' + (round.isFinal ? 'Final board' : 'Board ' + (bi + 1)) +
      '</h3><p class="meta">' + meta + ' &middot; ' + adv + '</p></header><div class="match">' + tiles + '</div>' + status + '</article>';
  }

  function render() {
    ensurePerm();
    parseNames();
    var R = build();
    CUR = R;

    /* setup rail */
    ['n', 'g', 'k'].forEach(function (f) {
      var el = $('#' + f);
      if (document.activeElement !== el) el.value = S[f];
    });
    $('#k').max = S.g - 1;
    $('#hint-n').textContent = 'Lettered A to ' + label(S.n - 1) + '.';
    $('#hint-g').textContent = S.g + ' at a board, played as ' + versus(S.g) + '.';
    var clamped = R.some(function (rd) { return !rd.isFinal && rd.boards.some(function (b) { return b.k < S.k; }); });
    $('#hint-k').textContent = 'Top ' + S.k + ' of each board go through.' + (clamped ? ' A short board sends one fewer than its size.' : '');
    $('#draw-order').checked = S.draw === 'order';
    $('#draw-random').checked = S.draw === 'random';
    $('#reshuffle').hidden = S.draw !== 'random';

    var roster = '';
    for (var i = 0; i < S.n; i++) {
      var l = label(i);
      roster += '<div class="slot"><span class="tile">' + l + '</span><span class="cap">' + esc(NAMES[i] || '') + '</span></div>';
    }
    $('#players').innerHTML = roster;

    /* fixtures */
    var boardsTotal = R.reduce(function (a, rd) { return a + rd.boards.length; }, 0);
    var path = '<section class="path" aria-label="Tournament path"><h2 class="out-h">Tournament path</h2><p class="sum">' +
      plural(R.length, 'round') + ' and ' + plural(boardsTotal, 'board') + ' in total.</p><ol>' +
      R.map(function (rd) {
        return '<li' + (rd.isFinal ? ' class="final"' : '') + '><span class="r">' + (rd.isFinal ? 'Final' : 'Round ' + (rd.idx + 1)) +
          '</span><span class="n">' + plural(rd.n, 'player') + '</span><span class="n">' + plural(rd.boards.length, 'board') + '</span></li>';
      }).join('') + '</ol><p class="help">Tap players in finishing order to record who moves on. The next round fills in with their letters.</p></section>';

    var rounds = R.map(function (rd) {
      var done = rd.boards.filter(function (b) { return b.sel.length >= b.k; }).length;
      var meta = plural(rd.n, 'player') + ' &middot; ' + plural(rd.boards.length, 'board') + (rd.isFinal ? '' : ' &middot; ' + rd.adv + ' move on') +
        (done ? ' &middot; ' + done + '/' + rd.boards.length + ' decided' : '');
      return '<section class="round' + (rd.isFinal ? ' final' : '') + '"><header><h2>' + (rd.isFinal ? 'Final' : 'Round ' + (rd.idx + 1)) +
        '</h2><p class="rm">' + meta + '</p></header><div class="boards">' +
        rd.boards.map(function (b, bi) { return boardHTML(rd, b, bi); }).join('') + '</div></section>';
    }).join('');

    $('#out').innerHTML = path + rounds;
  }

  function buildText() {
    var lines = ['Scrabble tournament: ' + S.n + ' players, ' + S.g + ' per board, top ' + S.k + ' move on', ''];
    CUR.forEach(function (rd) {
      lines.push(rd.isFinal ? 'Final' : 'Round ' + (rd.idx + 1));
      rd.boards.forEach(function (b, bi) {
        var parts = b.members.map(function (m) {
          if (m.ph) return m.ph;
          var nm = nameOf(m.l);
          return m.l + (nm ? ' (' + nm + ')' : '');
        });
        lines.push((rd.isFinal ? 'Final board' : 'Board ' + (bi + 1)) + ': ' + (b.size === 1 ? parts[0] + ' (bye)' : parts.join(' v ')));
      });
      lines.push('');
    });
    return lines.join('\n');
  }

  function limits(f) { return f === 'n' ? [2, 200] : f === 'g' ? [2, 50] : [1, S.g - 1]; }

  function setCfg(f, v) {
    var lim = limits(f);
    v = clamp(v, lim[0], lim[1]);
    if (v === S[f]) return;
    S[f] = v;
    if (f === 'g' && S.k > S.g - 1) S.k = S.g - 1;
    if (f === 'n') S.perm = [];
    S.results = {};
    save();
    render();
  }

  var toastTimer;
  function toast(msg) {
    var t = $('#toast');
    t.textContent = msg;
    clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { t.textContent = ''; }, 3500);
  }

  /* events */
  document.addEventListener('click', function (e) {
    var step = e.target.closest('[data-step]');
    if (step) {
      var f = step.getAttribute('data-step');
      var errEl = $('#err-' + f);
      if (errEl) errEl.textContent = '';
      setCfg(f, S[f] + parseInt(step.getAttribute('data-dir'), 10));
      $('#' + f).value = S[f];
      return;
    }
    var tile = e.target.closest('button.tile[data-key]');
    if (tile) {
      var key = tile.getAttribute('data-key'), l = tile.getAttribute('data-l');
      var found = null;
      CUR.forEach(function (rd) { rd.boards.forEach(function (b) { if (b.key === key) found = b; }); });
      if (!found) return;
      var sel = found.sel.slice(), pos = sel.indexOf(l);
      if (pos > -1) sel.splice(pos, 1);
      else if (sel.length < found.k) sel.push(l);
      else { toast('That board already has ' + found.k + ' chosen. Tap a chosen tile to undo it.'); return; }
      S.results[key] = sel;
      save();
      render();
      var again = document.querySelector('.tile[data-key="' + key + '"][data-l="' + l + '"]');
      if (again) again.focus();
    }
  });

  ['n', 'g', 'k'].forEach(function (f) {
    var el = $('#' + f);
    el.addEventListener('input', function () {
      var v = parseInt(el.value, 10), lim = limits(f), err = $('#err-' + f);
      if (isNaN(v) || v < lim[0] || v > lim[1]) {
        err.textContent = 'Enter a number from ' + lim[0] + ' to ' + lim[1] + '.';
        return;
      }
      err.textContent = '';
      setCfg(f, v);
    });
    el.addEventListener('change', function () { $('#err-' + f).textContent = ''; el.value = S[f]; });
  });

  document.querySelectorAll('input[name="draw"]').forEach(function (r) {
    r.addEventListener('change', function () {
      S.draw = r.value;
      S.results = {};
      save();
      render();
    });
  });
  $('#reshuffle').addEventListener('click', function () {
    S.perm = shuffled(S.n);
    S.results = {};
    save();
    render();
    toast('Draw reshuffled. Results were cleared.');
  });
  $('#names').addEventListener('input', function (e) { S.names = e.target.value; save(); render(); });
  $('#clear').addEventListener('click', function () { S.results = {}; save(); render(); toast('Results cleared.'); });
  $('#copy').addEventListener('click', function () {
    var text = buildText();
    var fb = $('#fallback');
    var done = function () { fb.hidden = true; toast('Fixtures copied.'); };
    var fail = function () { fb.hidden = false; fb.value = text; fb.focus(); fb.select(); toast('Copy the selected text below.'); };
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(text).then(done, fail);
      else fail();
    } catch (err) { fail(); }
  });

  $('#names').value = S.names;
  render();
})();
</script>

</body></html>
